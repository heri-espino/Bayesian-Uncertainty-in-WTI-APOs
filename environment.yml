name: asian-options
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # MiKTeX latexmk needs Perl; conda-forge provides a user-local Windows build.
  - perl
  # Conda-native PDF-to-SVG fallback for older Inkscape installations.
  - poppler
  # Remove leaked Word author metadata from blinded PDF exports.
  - pypdf
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.13
  - matplotlib>=3.9
  - pytest>=8.0
  - psutil>=6.0
  - yfinance>=1.4
