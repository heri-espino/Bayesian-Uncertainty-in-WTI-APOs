name: build-remef

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  word:
    name: REMEF editable Word draft and preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact selected revision
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Word and preview tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc inkscape librsvg2-bin libreoffice-writer poppler-utils texlive-xetex texlive-latex-recommended texlive-latex-extra fonts-liberation

      - name: Install project and Word dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install python-docx

      - name: Validate repo and both source layouts
        run: |
          python -m scripts.check_repo_structure
          python paper/build.py --check
          python paper/build_short.py --check
          python paper/remef/build.py --check

      - name: Build blinded REMEF Word draft and author-identifying version
        run: |
          python paper/remef/build.py
          python paper/remef/build.py --author-version

      - name: Inspect Word document structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path("paper/remef/build/remef_blinded_draft.docx")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Missing Word draft")
          with ZipFile(path) as z:
              xml = z.read("word/document.xml").decode("utf-8")
              math = xml.count("<m:oMath")
              tables = xml.count("<w:tbl>")
              media = [name for name in z.namelist() if name.startswith("word/media/")]
              vectors = [name for name in media if name.endswith(".svg")]
              native_svg = xml.count("svgBlip")
              print(f"Editable math: {math}; Word tables: {tables}; "
                    f"embedded SVG: {len(vectors)}; native SVG references: {native_svg}")
              if math < 30 or tables != 6 or len(vectors) < 2 or native_svg < 2:
                  raise SystemExit("Expected editable equations, four Word tables and native SVG figures")
              for name in vectors:
                  raw = z.read(name).decode("utf-8")
                  if any(t in raw.lower() for t in ("heriberto", "espino-montelongo", "@udlap.mx")):
                      raise SystemExit("Identifying data leaked into blinded SVG: " + name)
          from docx import Document
          doc = Document(path)
          heads = [p.text for p in doc.paragraphs if p.style.name == "Heading 1"]
          expected = [
              "1. Introduction", "2. Literature review", "3. Methodology",
              "4. Results and discussion", "5. Conclusions and recommendations",
          ]
          if not all(name in heads for name in expected):
              raise SystemExit(f"REMEF section structure not found: {heads}")
          text = "\\n".join(p.text for p in doc.paragraphs)
          if "Curran, M. (1994)" not in text or "Matías González" not in text:
              raise SystemExit("APA bibliography or REMEF precedents are missing")
          if "To be completed" in text:
              raise SystemExit("Unfinished placeholder leaked into blinded review draft")
          if len(doc.tables) != 6 or doc.tables[0].cell(0, 1).text != "N":
              raise SystemExit("Table conversion / header missing")
          for phrase in ("This research received no external funding.",
                         "The author declares no conflicts of interest."):
              if phrase not in text:
                  raise SystemExit("Author-verified declaration missing: " + phrase)
          from zipfile import ZipFile
          author = Path("paper/remef/build/remef_author_draft.docx")
          if not author.is_file():
              raise SystemExit("Missing REMEF author-identifying version")
          with ZipFile(author) as z:
              doc_xml = z.read("word/document.xml").decode("utf-8")
              footnotes = z.read("word/footnotes.xml").decode("utf-8")
              joined = doc_xml + footnotes
              for phrase in ("Heriberto Espino-Montelongo",
                             "heriberto.espinomo@udlap.mx",
                             "0009-0009-1230-2931",
                             "Ex Hacienda Santa Catarina",
                             "C.P. 72810", "+52 222 810 1202"):
                  if phrase not in joined:
                      raise SystemExit("Missing verified author metadata: " + phrase)
              if "footnoteReference" not in doc_xml:
                  raise SystemExit("REMEF author version lacks correspondence footnote")
          with ZipFile(path) as z:
              for member in z.namelist():
                  if member.endswith(".xml") or member.endswith(".rels"):
                      xml=z.read(member).decode("utf-8")
                      if any(identifier in xml for identifier in (
                          "Heriberto Espino-Montelongo",
                          "heriberto.espinomo@udlap.mx",
                          "0009-0009-1230-2931",
                          "heri-espino.github.io",
                          "linkedin.com/in/heri-espino",
                          "Ex Hacienda Santa Catarina",
                          "C.P. 72810", "+52 222 810 1202",
                      )):
                          raise SystemExit("Identifying metadata leaked into blinded draft: " + member)
          print("REMEF structure, APA, editable math, author metadata, declarations and blinding passed.")
          PY

      # LibreOffice 24.2 can drop native OMML mathematical glyphs on PDF export.
      # Keep the editable Word document as the submission deliverable.
      # Use LibreOffice ONLY for a conservative pagination/layout check.
      # Independently typeset mathematical content from the SAME DOCX using
      # Pandoc + XeLaTeX, so formulas remain visible in the reference PDF.
      - name: Generate pagination check and mathematical-content PDF reference
        run: |
          mkdir -p paper/remef/build/lo_layout
          libreoffice -env:UserInstallation=file:///tmp/lo_remef --headless \
            --convert-to pdf --outdir paper/remef/build/lo_layout \
            paper/remef/build/remef_blinded_draft.docx
          pandoc paper/remef/build/remef_blinded_draft.docx \
            --from=docx --to=pdf --pdf-engine=xelatex \
            -V mainfont="Liberation Serif" \
            -V papersize=letter \
            -V geometry:margin=1in \
            -o paper/remef/build/remef_math_reference.pdf

          # Important: the Pandoc PDF is a mathematical CONTENT reference, not
          # a pixel-perfect rendering of the Word layout.
          pdftotext -layout paper/remef/build/remef_math_reference.pdf \
            paper/remef/build/math_reference_text.txt
          python - <<'PY'
          import re
          import subprocess
          import unicodedata
          from pathlib import Path
          from zipfile import ZipFile

          out = Path("paper/remef/build")
          word = out / "remef_blinded_draft.docx"
          layout_pdf = out / "lo_layout" / "remef_blinded_draft.pdf"
          math_pdf = out / "remef_math_reference.pdf"

          def page_count(path):
              info = subprocess.check_output(["pdfinfo", str(path)], text=True)
              match = re.search(r"^Pages:\s*(\d+)$", info, re.M)
              if not match:
                  raise SystemExit(f"Cannot determine PDF page count: {path}")
              return int(match.group(1))

          # Both references must respect REMEF's 25-page limit.
          for pdf, label in ((layout_pdf, "LibreOffice pagination"),
                             (math_pdf, "XeLaTeX mathematical reference")):
              pages = page_count(pdf)
              print(f"{label}: {pages} pages")
              if pages > 25:
                  raise SystemExit(f"{label} exceeds REMEF's 25-page limit")

          # pdftotext often represents italic Greek mathematical letters with
          # U+1D70E-style Unicode. NFKC folds those back to plain Greek letters.
          text = unicodedata.normalize(
              "NFKC", (out / "math_reference_text.txt").read_text(encoding="utf-8")
          )
          for symbol in ("σ", "μ"):
              if symbol not in text:
                  raise SystemExit(
                      f"Mathematical content missing from XeLaTeX reference: {symbol}"
                  )
          if "Physical-measure inference" not in text:
              raise SystemExit("Methodology content missing from math reference")
          with ZipFile(word) as z:
              xml = z.read("word/document.xml").decode("utf-8")
              if xml.count("<m:oMath") < 30:
                  raise SystemExit("Native Word equation objects are missing")
          print("Native Word equations and visible XeLaTeX mathematics verified.")
          print("Review Word layout in Microsoft Word before submission.")
          PY

      - name: Upload REMEF review draft
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remef-wti-apo-draft-${{ github.sha }}
          path: |
            paper/remef/build/remef_blinded_draft.docx
            paper/remef/build/remef_author_draft.docx
            paper/remef/build/remef_math_reference.pdf
            paper/remef/build/vector_figures/*.svg
          if-no-files-found: warn
          retention-days: 30
