name: Remove merged REMEF Word layout feature branch (once)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-remef-word-layout-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'heri-espino/Bayesian-Uncertainty-in-WTI-APOs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify PR 80 and exact branch ref before deletion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_MAIN: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          url="https://api.github.com/repos/"+os.environ["REPO"]
          branch="paper/remef-word-layout-reference-2026-10-18"
          sha="ac8720dd01af2b39fe9a4f5dd7523b22c2fe69d9"
          def api(method,path):
              req=urllib.request.Request(url+path,method=method,headers={
                "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                "Accept":"application/vnd.github+json",
                "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  return json.loads(b) if b else None
          if api("GET","/git/ref/heads/main")["object"]["sha"]!=os.environ["EVENT_MAIN"]:
              raise RuntimeError("main advanced, abort cleanup")
          refs={x["name"] for x in api("GET","/branches?per_page=100")}
          if refs!={"main",branch}:
              raise RuntimeError("Unexpected branches, abort cleanup: "+repr(refs))
          ref="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          if api("GET",ref)["object"]["sha"]!=sha:
              raise RuntimeError("Feature branch moved, abort cleanup")
          pr=api("GET","/pulls/80")
          if pr["state"]!="closed" or not pr["merged_at"] or pr["head"]["ref"]!=branch or pr["head"]["sha"]!=sha:
              raise RuntimeError("PR #80 not verified")
          api("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          names=[x["name"] for x in api("GET","/branches?per_page=100")]
          if names!=["main"]:
              raise RuntimeError("Only main should remain: "+repr(names))
          print("Verified only main remains.")
          PY
