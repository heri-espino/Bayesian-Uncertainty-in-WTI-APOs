# One-time repository hygiene for the explicitly reviewed October 2026 branches.
# The workflow is added by PR, runs only on the merge that adds this file to main,
# then is removed after successful verification. No experiments are launched.
name: Prune reviewed obsolete branches (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-branches-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'heri-espino/Bayesian-Uncertainty-in-WTI-APOs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify PRs and branch SHA leases, then delete reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_MAIN_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import quote

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          cleanup = "chore/prune-obsolete-branches-2026-10-18"
          # Exact reviewed refs and SHA leases from the October 18 branch audit.
          # Squash-merged PRs have nonzero ahead counts; that does not mean their
          # old text should be replayed over newer main.
          stale = {
              "paper/concise-argument-structure-2026-10-17": "bbeee1b5776a6fc193f630dfe853a85ec95d658f",
              "paper/field-reader-edit-2026-10-17": "7543abd2b3147795b8d577c2e3b294efab9633c3",
              "paper/integrate-concise-rewrite": "b9d9252c38d5012b6a22188ac67ea4cf18fed77c",
              "paper/plain-language-2026-10-17": "76fd739d8ad9deb9f912b1343e29dd9a095a71d9",
              "paper/readability-second-pass-2026-10-17": "6dd9bfa5fdff588e07869e4226ad20ed15a90271",
              "paper/remef-adaptation-2026-10-17": "42d9319d45c7d2910afef3e5db44f80df3d4004f",
              "paper/remef-fallback-plan": "34bee336fa056a96f7d29924bf5d09317d83ac07",
          }
          merged_prs = (69, 71, 72, 73, 74)
          superseded_prs = (68, 70)

          def call(method, route):
              request = urllib.request.Request(
                  api + route,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None

          def get_ref(name):
              path = "/git/ref/heads/" + quote(name, safe="/")
              result = call("GET", path)
              if result["ref"] != "refs/heads/" + name:
                  raise RuntimeError(f"Unexpected ref for {name}")
              return result["object"]["sha"]

          # Abort before making any deletion if the reviewed snapshot changed.
          if get_ref("main") != os.environ["EVENT_MAIN_SHA"]:
              raise RuntimeError("main advanced after the cleanup workflow was queued")
          branches = call("GET", "/branches?per_page=100")
          actual = {branch["name"] for branch in branches}
          expected = {"main", cleanup, *stale}
          if actual != expected:
              raise RuntimeError(f"Branch set changed; aborting. Actual: {sorted(actual)}")
          for name, sha in stale.items():
              if get_ref(name) != sha:
                  raise RuntimeError(f"Branch changed since review: {name}")

          for number in merged_prs:
              pr = call("GET", f"/pulls/{number}")
              if not pr["merged_at"] or pr["state"] != "closed" or pr["base"]["ref"] != "main":
                  raise RuntimeError(f"Expected merged PR #{number}")
          for number in superseded_prs:
              pr = call("GET", f"/pulls/{number}")
              if pr["state"] != "closed" or pr["merged_at"]:
                  raise RuntimeError(f"Expected closed superseded PR #{number}")

          # This cleanup PR must itself be merged, with no additional commits
          # on its head branch. Find it rather than hardcoding a new PR number.
          prs = call("GET", "/pulls?state=closed&per_page=100")
          cleanup_sha = get_ref(cleanup)
          matching = [
              pr for pr in prs
              if pr["head"]["ref"] == cleanup
              and pr["head"]["sha"] == cleanup_sha
              and pr["merged_at"]
              and pr["base"]["ref"] == "main"
          ]
          if len(matching) != 1:
              raise RuntimeError("Cleanup branch is not the unchanged head of one merged PR")

          # Delete exactly the reviewed refs; never delete main.
          for name, sha in [*stale.items(), (cleanup, cleanup_sha)]:
              if get_ref(name) != sha:
                  raise RuntimeError(f"Ref moved during cleanup: {name}")
              call("DELETE", "/git/refs/heads/" + quote(name, safe="/"))
              print(f"Deleted reviewed branch: {name}")

          left = call("GET", "/branches?per_page=100")
          remaining = [item["name"] for item in left]
          if remaining != ["main"]:
              raise RuntimeError(f"Expected only main after pruning: {remaining}")
          print("Verified remote branch list: main only")
          PY
