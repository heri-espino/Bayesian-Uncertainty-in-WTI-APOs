name: Delete merged REMEF drafting branch (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-remef-branch-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'heri-espino/Bayesian-Uncertainty-in-WTI-APOs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PR and unchanged branch before deletion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_MAIN: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          base = "https://api.github.com/repos/" + os.environ["REPO"]
          branch = "paper/remef-compliance-2026-10-18"
          sha = "e46e7473ee582f9bd5ad2f55b388a283724f2b5e"
          def request(method, path):
              req=urllib.request.Request(base+path,method=method,headers={
                "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                "Accept":"application/vnd.github+json",
                "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as res:
                data=res.read()
                return json.loads(data) if data else None
          main = request("GET", "/git/ref/heads/main")["object"]["sha"]
          if main != os.environ["CURRENT_MAIN"]:
              raise RuntimeError("main moved; aborting cleanup")
          refs = request("GET", "/branches?per_page=100")
          if {x["name"] for x in refs} != {"main", branch}:
              raise RuntimeError("Unexpected branch set; aborting")
          name = "/git/ref/heads/" + urllib.parse.quote(branch,safe="/")
          if request("GET",name)["object"]["sha"] != sha:
              raise RuntimeError("Working branch moved; aborting")
          pr=request("GET","/pulls/76")
          if pr["state"] != "closed" or not pr["merged_at"] or pr["head"]["ref"] != branch or pr["head"]["sha"] != sha:
              raise RuntimeError("PR #76 does not match reviewed merge")
          request("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          remaining=[x["name"] for x in request("GET","/branches?per_page=100")]
          if remaining != ["main"]:
              raise RuntimeError("Unexpected remaining branches: "+str(remaining))
          print("Verified only main remains.")
          PY
