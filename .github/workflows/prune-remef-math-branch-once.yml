name: Delete merged REMEF math-preview branch (one time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-remef-math-branch-once.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'heri-espino/Bayesian-Uncertainty-in-WTI-APOs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete only checked obsolete ref after verifying PR 79
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base="https://api.github.com/repos/"+os.environ["REPO"]
          branch="fix/remef-math-pdf-preview-2026-10-18"
          expected="98bb96351b0de0ffef26712ca348e90a9aa716c3"
          def api(method, path):
              req=urllib.request.Request(base+path,method=method,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  content=r.read()
                  return json.loads(content) if content else None
          if api("GET","/git/ref/heads/main")["object"]["sha"] != os.environ["MAIN_SHA"]:
              raise RuntimeError("main advanced; aborting")
          actual={item["name"] for item in api("GET","/branches?per_page=100")}
          if actual != {"main",branch}:
              raise RuntimeError(f"Unexpected branch set: {actual}")
          ref="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          if api("GET",ref)["object"]["sha"] != expected:
              raise RuntimeError("Reviewed feature branch advanced; aborting")
          pr=api("GET","/pulls/79")
          if pr["state"]!="closed" or not pr["merged_at"] or pr["head"]["ref"]!=branch or pr["head"]["sha"]!=expected:
              raise RuntimeError("PR #79 merge mismatch")
          api("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          remaining=[item["name"] for item in api("GET","/branches?per_page=100")]
          if remaining!=["main"]:
              raise RuntimeError("Unexpected refs remain: "+repr(remaining))
          print("Verified main only.")
          PY
