name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Run reproducible synthetic validation smoke test
        run: >-
          python experiments/synthetic_validation.py
          --quick
          --parameter-replications 5
          --posterior-replications 1
          --output-dir /tmp/synthetic_validation
