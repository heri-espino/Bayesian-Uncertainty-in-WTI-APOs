name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and documentation dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy pandas pytest psutil
          -r docs/requirements.txt
      - name: Compile research utility and long-run scripts
        run: >-
          python -m py_compile
          scripts/system_probe.py
          src/accelerated_pricing.py
          src/asian_futures_pricing.py
          src/wti_yahoo.py
          src/barchart_apo.py
          src/wti_first_nearby.py
          src/wti_apo_pricing.py
          src/volatility_regimes.py
          experiments/large_scale_synthetic.py
          experiments/precompute_pricing_grids.py
          experiments/analyze_extreme_results.py
          experiments/wti_yahoo_application.py
          experiments/build_wti_apo_panel.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build Sphinx API documentation
        run: python -m sphinx -W --keep-going -b html docs /tmp/sphinx-html
      - name: Audit committed WTI APO histories
        run: >-
          python -m experiments.build_wti_apo_panel
          --input-dir data/csv
          --output-dir /tmp/wti_apo
      - name: Run system probe without requiring NVIDIA/CuPy
        run: python -m scripts.system_probe --output-dir /tmp/system_probe
      - name: Run reproducible synthetic validation smoke test
        run: >-
          python -m experiments.synthetic_validation
          --quick
          --parameter-replications 5
          --posterior-replications 1
          --output-dir /tmp/synthetic_validation
      - name: Analyze committed extreme experiment
        run: >-
          python -m experiments.analyze_extreme_results
          --output /tmp/extreme_analysis.json
