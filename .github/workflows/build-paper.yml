name: build-paper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: figures + Wiley PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science \
            dvipng \
            ghostscript \
            cm-super \
            perl \
            poppler-utils

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate manuscript layout
        run: python paper/build.py --check

      - name: Prepare vendored Utopia typography
        run: |
          python -m scripts.vendor_utopia_fonts | tee /tmp/vendor-font-report.json

      - name: Build publication figures
        run: python -m scripts.build_publication_figures --formats pdf png

      - name: Require vendored Wiley typography
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("figures/publication/figure_manifest.json").read_text(encoding="utf-8")
          )
          mode = manifest.get("font_mode")
          print(f"Figure font mode: {mode}")
          if mode != "wiley-utopia-vendored":
              raise SystemExit(
                  "Publication figures were not rendered with the vendored "
                  f"Wiley Utopia stack (font_mode={mode!r})."
              )
          PY

      - name: Compile Wiley manuscript
        run: |
          python paper/build.py --clean
          python paper/build.py

      - name: Verify PDF output
        run: |
          test -s paper/espino_2026_bayess-on-wti.pdf
          pdfinfo paper/espino_2026_bayess-on-wti.pdf | head -n 20

      - name: Upload compiled paper
        uses: actions/upload-artifact@v4
        with:
          name: jfm-paper-${{ github.sha }}
          path: |
            paper/espino_2026_bayess-on-wti.pdf
            figures/publication/*.pdf
            figures/publication/*.png
            figures/publication/figure_manifest.json
          if-no-files-found: error
          retention-days: 30
