name: build-paper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: JFM figure previews + Wiley PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science \
            dvipng \
            ghostscript \
            cm-super \
            perl \
            poppler-utils

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate manuscript layout
        run: python paper/build.py --check

      - name: Prepare vendored Utopia typography
        run: |
          python -m scripts.vendor_utopia_fonts | tee /tmp/vendor-font-report.json

      - name: Build isolated JFM figures (preview typography)
        run: python -m scripts.build_publication_figures --journal jfm --formats pdf png svg --allow-font-fallback

      - name: Verify JFM-only figure output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("figures/jfm")
          info = json.loads((root / "figure_manifest.json").read_text(encoding="utf-8"))
          assert info.get("journal_target") == "jfm"
          for number, title in ((1, "fig01_mechanism_map"), (2, "fig02_historical_vs_apo_implied_volatility"), (3, "fig03_forward_q_cluster_bootstrap"), (4, "fig04_numerical_identification")):
              path = root / (title + ".pdf")
              assert path.is_file() and path.stat().st_size > 0, path
          print("JFM figure previews are isolated; font match still requires visual proof")
          PY

      - name: Compile Wiley manuscript
        run: |
          python paper/build.py --clean
          python paper/build.py

      - name: Verify PDF output
        run: |
          test -s paper/espino_2026_bayess-on-wti.pdf
          pdfinfo paper/espino_2026_bayess-on-wti.pdf | head -n 20

      - name: Check reviewer anonymity in the compiled PDF and source archive
        run: |
          test ! -e paper/build/stage/jfm_title_page.tex
          test ! -e paper/build/stage/main_short.tex
          pdftotext paper/espino_2026_bayess-on-wti.pdf /tmp/jfm-review-text.txt
          if grep -Eiq 'Heriberto|Espino-Montelongo|@udlap[.]mx|heri-espino' /tmp/jfm-review-text.txt; then
            echo "Identifying information detected in JFM reviewer PDF"
            exit 1
          fi
          echo "Compiled Wiley review copy passed text-anonymity check"

      - name: Upload compiled paper
        uses: actions/upload-artifact@v4
        with:
          name: jfm-wiley-preview-${{ github.sha }}
          path: |
            paper/espino_2026_bayess-on-wti.pdf
            figures/jfm/*.pdf
            figures/jfm/*.png
            figures/jfm/*.svg
            figures/jfm/figure_manifest.json
          if-no-files-found: error
          retention-days: 30
