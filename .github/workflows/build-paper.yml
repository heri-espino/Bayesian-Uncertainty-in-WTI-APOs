name: build-paper

# Manual-only JFM build. The other Windows runner was removed.
# Select by standard Windows x64 labels and verify runner identity; never run on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: JFM Wiley PDF and isolated vector figures on PCAG103A-15
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out exact selected revision without LFS downloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify target machine (never run on PCAG103A-08)
        run: |
          if ($env:RUNNER_NAME -ne "PCAG103A-15") {
            throw "Wrong runner $env:RUNNER_NAME; expected PCAG103A-15"
          }
          Write-Host "Using $env:RUNNER_NAME"

      - name: Locate existing user-level Conda environment
        run: |
          & .\scripts\resolve_conda_windows_runner.ps1 -EnvironmentName asian-options

      - name: Confirm existing Wiley compilation tools (no installs)
        run: |
          & $env:CONDA_EXE run --no-capture-output -n asian-options python -c "import shutil; print({k:shutil.which(k) for k in ('xelatex','bibtex','perl','latexmk')}); assert shutil.which('xelatex') and shutil.which('bibtex'), 'MiKTeX XeLaTeX/BibTeX are not available to the runner account'"
          if ($LASTEXITCODE -ne 0) { throw "Existing MiKTeX toolchain not found; no installer was run." }

      - name: Supply missing user-level MiKTeX packages for Wiley template
        run: |
          & .\scripts\ensure_jfm_miktex_packages.ps1

      - name: Validate concise Wiley manuscript
        run: |
          & $env:CONDA_EXE run --no-capture-output -n asian-options python paper/build.py --check
          if ($LASTEXITCODE -ne 0) { throw "JFM layout validation failed" }

      - name: Render JFM-only figures from existing derived results
        run: |
          & $env:CONDA_EXE run --no-capture-output -n asian-options python -m scripts.build_publication_figures --journal jfm --formats pdf png svg --allow-font-fallback
          if ($LASTEXITCODE -ne 0) { throw "JFM figure rendering failed" }

      - name: Compile anonymous Wiley LaTeX document
        run: |
          & $env:CONDA_EXE run --no-capture-output -n asian-options python paper/build.py
          if ($LASTEXITCODE -ne 0) { throw "Wiley XeLaTeX compilation failed" }

      - name: Verify anonymous reviewer PDF and separate figure outputs
        run: |
          & $env:CONDA_EXE run --no-capture-output -n asian-options python -m scripts.verify_jfm_runner_build
          if ($LASTEXITCODE -ne 0) { throw "Reviewer anonymity or figure output verification failed" }

      - name: Upload JFM PDF and figures (never auto-commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfm-wiley-PCAG103A-15-${{ github.sha }}-run-${{ github.run_id }}
          path: |
            paper/espino_2026_bayess-on-wti.pdf
            figures/jfm/*.pdf
            figures/jfm/*.png
            figures/jfm/*.svg
            figures/jfm/figure_manifest.json
          if-no-files-found: warn
          retention-days: 30
