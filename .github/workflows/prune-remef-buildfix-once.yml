name: Prune merged REMEF build fix branch (once)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-remef-buildfix-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'heri-espino/Bayesian-Uncertainty-in-WTI-APOs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SHA leases, merged PR and remove only obsolete branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base="https://api.github.com/repos/"+os.environ["REPO"]
          branch="fix/remef-build-and-author-contact-2026-10-18"
          expected="469a782a926132dd98edbd05868fe7fe4a84a8c7"
          def api(method, route):
              req=urllib.request.Request(base+route, method=method, headers={
                  "Authorization": "Bearer "+os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req,timeout=30) as res:
                  raw=res.read()
                  return json.loads(raw) if raw else None
          if api("GET","/git/ref/heads/main")["object"]["sha"] != os.environ["MAIN_SHA"]:
              raise RuntimeError("main moved; no branches deleted")
          names={x["name"] for x in api("GET","/branches?per_page=100")}
          if names != {"main", branch}:
              raise RuntimeError("Unexpected branch set: "+repr(names))
          ref="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          if api("GET",ref)["object"]["sha"] != expected:
              raise RuntimeError("Reviewed branch moved")
          pr=api("GET","/pulls/78")
          if not pr["merged_at"] or pr["state"] != "closed" or pr["head"]["ref"] != branch or pr["head"]["sha"] != expected:
              raise RuntimeError("Merge of PR #78 not verified")
          api("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          remaining=[x["name"] for x in api("GET","/branches?per_page=100")]
          if remaining != ["main"]:
              raise RuntimeError("Unexpected branches remain: "+repr(remaining))
          print("Verified remote branches: main only")
          PY
