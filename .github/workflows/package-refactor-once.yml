name: one-time package refactor

on:
  push:
    branches: [package-library-restructure]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package-library-restructure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repository migration
        run: python scripts/_one_time_package_restructure.py
      - name: Install editable package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,market]"
      - name: Validate repository structure
        run: python -m scripts.check_repo_structure
      - name: Run tests
        run: python -m pytest -q
      - name: Build Sphinx documentation
        run: python -m sphinx -W --keep-going -b html docs /tmp/sphinx-html
      - name: Smoke-test empirical panel builder
        run: python -m experiments.build_wti_apo_panel --input-dir data/csv --output-dir /tmp/wti_apo
      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restructure repository around editable research library"
          git push origin HEAD:package-library-restructure
